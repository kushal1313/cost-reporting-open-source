name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Only needs the schema, not a live database connection.
        run: npm run db:generate -w @cost-reporting/db

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Audit dependencies
        # Blocks on high/critical findings with a known fix; Dependabot (see
        # .github/dependabot.yml) handles the ongoing patch cadence.
        run: npm audit --audit-level=high
